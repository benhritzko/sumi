<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sumi playground</title>
  <style>
    /* Sumi tokens (Ember edition) */
    :root { --paper: #000; --ink: #cdc4ba; --ink-faint: #807a73; --line: rgba(205, 196, 186, .26); }
    /* The canvas IS the page. raylib (resizable window) keeps its pixel size equal to
       the viewport, so CSS pixels and canvas pixels match and mouse input lines up. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
    .chip {
      position: fixed; right: 16px; bottom: 12px; z-index: 1;
      font: 500 10px/1.6 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink-faint);
    }
    .chip a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div class="chip"><span id="status">Loading…</span> · Rust + raylib → wasm · <a href="https://github.com/benhritzko/sumi">source</a></div>
  <script>
    var Module = {
      canvas: document.getElementById("canvas"),
      setStatus: function (s) { document.getElementById("status").textContent = s || "Scroll · click · keys 1–4"; },
      onRuntimeInitialized: function () { document.getElementById("canvas").focus(); },
    };
  </script>
  <script async src="sumi.js"></script>
</body>
</html>
